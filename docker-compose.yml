x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-grader}:${POSTGRES_PASSWORD:-grader_dev_only}@postgres:5432/${POSTGRES_DB:-grader}
  KAFKA_BROKERS: redpanda:9092
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-ai-grader-submissions}
  JWT_SECRET: ${JWT_SECRET:-local-only-change-this-to-a-random-secret}

x-shared-image: &shared-image
  image: ai-grader-shared:local
  build:
    context: .
    dockerfile: packages/shared/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grader_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-grader}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: bitnamilegacy/minio:2025.4.22
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
      S3_BUCKET: ${S3_BUCKET:-ai-grader-submissions}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        for attempt in {1..30}; do
        if /opt/bitnami/minio-client/bin/mc alias set local http://minio:9000
        "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; then
        /opt/bitnami/minio-client/bin/mc mb --ignore-existing "local/$$S3_BUCKET";
        exit 0;
        fi;
        sleep 2;
        done;
        echo "MinIO did not become available for bucket initialization" >&2;
        exit 1
    restart: "no"

  migrate:
    <<: *shared-image
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  kafka-topics:
    <<: *shared-image
    command: ["node", "packages/shared/dist/createTopics.js"]
    environment:
      <<: *app-environment
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  gateway:
    image: ai-grader-gateway:local
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      <<: *app-environment
      GATEWAY_PORT: 3000
      UPLOAD_SERVICE_URL: http://upload:3001
      RESULTS_SERVICE_URL: http://results:3003
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      upload:
        condition: service_healthy
      results:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  upload:
    image: ai-grader-upload:local
    build:
      context: .
      dockerfile: services/upload/Dockerfile
    environment:
      <<: *app-environment
      UPLOAD_PORT: 3001
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  results:
    image: ai-grader-results:local
    build:
      context: .
      dockerfile: services/results/Dockerfile
    environment:
      <<: *app-environment
      RESULTS_PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grader:
    image: ai-grader-grader:local
    build:
      context: .
      dockerfile: services/grader/Dockerfile
    environment:
      <<: *app-environment
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GRADING_RUBRIC: ${GRADING_RUBRIC:-}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  redpanda-data:
  minio-data:
