services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grader_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-grader}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: bitnamilegacy/minio:2025.4.22
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
      S3_BUCKET: ${S3_BUCKET:-ai-grader-submissions}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        for attempt in {1..30}; do
        if /opt/bitnami/minio-client/bin/mc alias set local http://minio:9000
        "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; then
        /opt/bitnami/minio-client/bin/mc mb --ignore-existing "local/$$S3_BUCKET";
        exit 0;
        fi;
        sleep 2;
        done;
        echo "MinIO did not become available for bucket initialization" >&2;
        exit 1
    restart: "no"

volumes:
  postgres-data:
  redpanda-data:
  minio-data:
